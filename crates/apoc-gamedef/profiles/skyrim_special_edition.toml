# The Elder Scrolls V: Skyrim Special Edition.
#
# The first Creation Engine game, and the first whose mods ship FOMOD
# installers as a matter of course. As with every other game, this document is
# the entire game-specific footprint: no engine crate contains a branch on
# whether it is Skyrim.
#
# This profile is the first to claim `load_order = "explicit"`, which is a
# promise that Apocrypha writes the game's plugin list. `[plugin_list]` below is
# what makes the promise keepable; a profile carrying one without the other is
# refused when it is parsed.

id = "skyrim-special-edition"
name = "The Elder Scrolls V: Skyrim Special Edition"
engine = "creation"
nexus_domain = "skyrimspecialedition"

# Creation Engine reads a named list of plugin files whose position is
# meaningful, which is a different thing from the integer-per-mod ordering every
# other game here uses. Loose files under `Data` still overwrite one another by
# mod priority; that has not changed. What `explicit` adds is that the plugins
# among them are also ordered by name, in a list the game reads.
load_order = "explicit"
conflict_scope = "per-relative-path"

# Windows-authored archives ship every casing, and Linux is case-sensitive. The
# engine only reads `Data`, and only reads `SKSE/Plugins` under it, so these
# components are forced to canonical casing on the way in.
case_sensitive = true
canonical_case = [
  "Data",
  "SKSE",
  "Plugins",
  "Interface",
  "Meshes",
  "Textures",
  "Scripts",
  "Source",
  "Sound",
  "Music",
  "Seq",
  "Shaders",
  "Strings",
]

# Skyrim mods are either a FOMOD or a plain set of folders belonging under
# `Data`. There is no Fluffy equivalent here.
formats = ["fomod", "loose-roots"]

# Extensions that carry load order rather than content. This is what the plugin
# scanner reads to decide which deployed files belong in the list at all.
plugin_extensions = ["esp", "esm", "esl"]

[detection]
steam_app_id = 489830
executable = "SkyrimSE.exe"

# Everything a Skyrim mod installs lives under `Data`.
[[deploy_targets]]
source = "Data"
target = "Data"

# Archives packed from the inside out: a bare `meshes/` at the archive root
# really means `Data/meshes/`. This is the single most common way a Skyrim mod
# is packaged, so without these an ordinary archive imports as zero files.

# The same thing with no folder at all. A great many Skyrim archives simply
# *are* the `Data` folder: SkyUI ships `SkyUI_SE.esp` and `SkyUI_SE.bsa` at the
# archive root with nothing around them, and no folder rule can catch that
# because there is no folder. A plugin or an archive file sitting loose at the
# root has exactly one place it can belong.
[[rewrap]]
extension = "esp"
prefix = "Data"

[[rewrap]]
extension = "esm"
prefix = "Data"

[[rewrap]]
extension = "esl"
prefix = "Data"

[[rewrap]]
extension = "bsa"
prefix = "Data"

[[rewrap]]
folder = "meshes"
prefix = "Data"

[[rewrap]]
folder = "textures"
prefix = "Data"

[[rewrap]]
folder = "scripts"
prefix = "Data"

[[rewrap]]
folder = "interface"
prefix = "Data"

[[rewrap]]
folder = "sound"
prefix = "Data"

[[rewrap]]
folder = "music"
prefix = "Data"

[[rewrap]]
folder = "seq"
prefix = "Data"

[[rewrap]]
folder = "skse"
prefix = "Data"

[[rewrap]]
folder = "source"
prefix = "Data"

# A Skyrim FOMOD writes `destination="meshes/x.nif"` and means
# `Data/meshes/x.nif`, because on this game everything lives under `Data` and
# nobody writes it out.
[fomod]
dest_prefix = "Data"

# Where the game reads its plugin order.
#
# The file lives in the Proton prefix, not the game directory:
# `compatdata/489830/pfx/drive_c/users/steamuser/AppData/Local/<dir>/`. Only the
# directory name is game-specific, so only the directory name is here.
[plugin_list]
dir = "Skyrim Special Edition"
plugins_file = "plugins.txt"

# Skyrim Special Edition reads order and activation from `plugins.txt` alone.
# `loadorder.txt` is a Skyrim Classic file that several external tools still
# read, so it is written alongside rather than left to disagree.
load_order_file = "loadorder.txt"

# `*MyMod.esp` is enabled; a bare `MyMod.esp` is a plugin the game knows about
# and does not load. Skyrim Classic used presence alone.
activation = "asterisk"

# Loaded by the engine whether or not the list names them. Every mod on this
# game names at least one as a master, so an order that did not know they exist
# would report every mod installed as depending on something missing.
#
# The Creation Club content is not here. It loads implicitly too, but only for
# somebody who owns it, and claiming a master exists when it does not is the
# error that matters: it turns a real broken dependency into a silent one.
implicit = [
  "Skyrim.esm",
  "Update.esm",
  "Dawnguard.esm",
  "HearthFires.esm",
  "Dragonborn.esm",
]

# Files that belong beside SkyrimSE.exe rather than under `Data`.
#
# A whole class of Skyrim mods lives here: the script extender, ENB, ReShade,
# DXVK, .NET Script Framework. Without this section their files are dropped and
# the install reports success, which for SKSE means the Papyrus scripts arrive,
# the extender does not, and every mod depending on it silently does nothing.
[root_files]

# Mod Organizer's Root Builder plugin established this convention and a large
# part of the Nexus ecosystem is already packaged for it. The folder is stripped
# and what remains deploys relative to the game directory, so `Root/dxgi.dll`
# installs as `dxgi.dll` and `Root/Data/x.esp` as `Data/x.esp`.
folder = "Root"

# For mods packaged without that folder, which includes SKSE itself: an `.exe`,
# two `.dll`s and a `Data` folder, all at the archive root.
#
# Patterns rather than names because the library carries the game version
# (`skse64_1_6_1170.dll`), so any fixed list is wrong by the next game update.
#
# Extensions rather than a denylist because that is what stays quiet: a
# `readme.txt`, a `whatsnew.txt`, a screenshot or the `src` tree SKSE ships its
# source in match nothing and are left alone, with no list of exclusions for
# anyone to maintain.
#
# `.ini` is here for ENB and ReShade, which are configured by files sitting
# beside the executable. It is the one entry that could plausibly catch
# something else at an archive root, and it is worth it: an ENB without its
# `enblocal.ini` is an ENB that does not run.
patterns = ["*.exe", "*.dll", "*.bin", "*.ini"]

# SKSE, the Skyrim Script Extender.
#
# This section said nothing for three releases, because `LoaderKind` offered
# only `none` and `dll-proxy`: declaring `dll-proxy` would have written a Wine
# DLL override for a DLL that overrides nothing and reported "loader ready"
# when nothing had been set up, so declaring no loader at all was the honest
# option. `launcher` is the kind that was missing.
#
# Nothing is provisioned for a launcher. There is no proxy DLL and no
# `[loader.proton]` section, because there is no registry value to write: the
# extender installs like any other mod through `[root_files]` above, and the
# only thing left is to *start* it instead of the game.
[loader]
name = "SKSE"
kind = "launcher"

# What Steam's Play button cannot reach. `steam://rungameid/489830` starts the
# executable Steam has registered and nothing else, so running this one is a
# separate action, offered as its own button rather than by quietly changing
# what Play means.
executable = "skse64_loader.exe"
