# Resident Evil 4 (2023): declarative game definition.
#
# The fifth game, and the second added purely to test the cost of adding one.
# Everything below except the four identity fields is byte-for-byte what
# Dragon's Dogma 2 says, which is the result the abstraction was supposed to
# produce and is asserted rather than left to be noticed.
#
# The id says 2023 because the 2005 original is a separate Steam app with its
# own, incompatible modding ecosystem. A bare `resident-evil-4` would make that
# ambiguity permanent in saved profiles and per-game directories, where it is
# expensive to undo. It also matches the Nexus domain.

id = "resident-evil-4-2023"
name = "Resident Evil 4 (2023)"
engine = "re-engine"
load_order = "priority"
conflict_scope = "per-relative-path"
case_sensitive = true
nexus_domain = "residentevil42023"

# RE Engine resolves loose files under `natives/STM` with that exact casing.
# Windows-authored archives ship every variant, and Linux is case-sensitive, so
# these components are forced to canonical casing at import time.
canonical_case = ["STM"]

# Format detectors this game accepts, in priority order. `fomod` is absent for
# the same reason it is absent from Wilds and Dragon's Dogma 2: this ecosystem
# packages with Fluffy, and claiming a format its mods do not use would make
# the list describe the schema instead of the game.
formats = ["fluffy-aio", "fluffy-single", "loose-natives", "reframework-only", "pak"]

# No `executable` key. Nothing reads it — Steam discovery takes the install
# directory from the app manifest and never looks for a binary — and the name
# could not be verified from a source, so this says nothing rather than
# asserting a guess.
[detection]
steam_app_id = 2050650

# Payload roots inside a normalized mod -> destination relative to the game dir.
[[deploy_targets]]
source = "natives"
target = "natives"

[[deploy_targets]]
source = "reframework"
target = "reframework"

# Standalone `.pak` mods must join the engine's patch chain to be seen by the
# game. Like Dragon's Dogma 2 and unlike Wilds, this title patches the base
# chunk directly rather than interposing a `sub_000` archive first.
[pak_chain]
pattern = "re_chunk_000.pak.patch_{n}.pak"
digits = 3
start_index = 1

[loader]
name = "REFramework"
kind = "dll-proxy"
proxy_dll = "dinput8.dll"
data_dirs = ["reframework/data"]

[loader.proton]
wine_dll_overrides = "dinput8=n,b"
steam_launch_options = 'WINEDLLOVERRIDES="dinput8=n,b" %command%'
requires_prefix_write = true

# Archives packed from the inside out: a bare `autorun/` really means
# `reframework/autorun/`. Without these a valid mod imports as zero files.
[[rewrap]]
folder = "autorun"
prefix = "reframework"

[[rewrap]]
folder = "plugins"
prefix = "reframework"

[[rewrap]]
folder = "fonts"
prefix = "reframework"

[[rewrap]]
folder = "images"
prefix = "reframework"

[[rewrap]]
folder = "STM"
prefix = "natives"
