# Cyberpunk 2077: declarative game definition.
#
# The second game, and the first one on a different engine. Everything specific
# to Cyberpunk lives in this file; no engine crate contains `if game == "cp77"`.
#
# REDengine spreads a mod across several unrelated trees rather than one payload
# folder, which is why `deploy_targets` has six entries instead of two:
#
#   archive/pc/mod/        .archive and .xl files (classic archive mods)
#   mods/<name>/           REDmod, the official format
#   r6/scripts/            redscript
#   r6/tweaks/             TweakXL
#   red4ext/plugins/       RED4ext native plugins
#   bin/x64/               the proxy DLLs, and Cyber Engine Tweaks' lua mods
#   engine/                config and tool overrides

id = "cyberpunk-2077"
name = "Cyberpunk 2077"
engine = "red-engine"
load_order = "priority"
conflict_scope = "per-relative-path"
case_sensitive = true
nexus_domain = "cyberpunk2077"

# REDengine's directories are lowercase on disk and Linux is case-sensitive, so
# a Windows-authored archive shipping `Archive/` or `R6/` must be folded back
# into the real tree rather than creating a second one the game never reads.
#
# A name earns a place here only if BOTH of these hold, because a segment is
# matched anywhere in a path and every entry is therefore a global rename of
# that word:
#
#   1. Something fixed reads it. The game, or a framework, opens that exact
#      path. A folder the mod's author named is theirs, and forcing a casing on
#      it to suit somebody else's mod is the same bug pointing the other way.
#   2. More than one party ships into it, so there is something to converge.
#      A folder that only ever arrives inside one distribution has nothing to
#      disagree with, and listing it spends a global rename for no gain.
#
# `redsUserHints` is the entry worth looking at twice: it is the only one that
# is not lowercase, which is what makes this a casing table rather than a
# lowercasing pass. redscript's compiler reads that exact spelling, and every
# redscript mod may ship one.
#
# Deliberately absent, both from Cyber Engine Tweaks' own tree: `IconGlyphs` and
# `json`. They pass the first test and fail the second, being vendored inside
# CET itself, so nothing diverges from them. `json` also shows the hazard of the
# first test alone: it is a word an author could reasonably use for their own
# `r6/scripts/MyMod/JSON/`, and renaming it there would be a change nobody asked
# for.
#
# Known limitation, and it is a real one rather than a theoretical one: entries
# are bare segments and match anywhere in a path, so every generic word below is
# a global rename of that word. `mod` is here because `Archive/PC/Mod/` is the
# commonest Windows-authored shape in this game, and the same entry then renames
# an author's own `r6/scripts/Mod/` to `r6/scripts/mod/`. So do `mods`, `base`,
# `tools`, `config`, `cache`, `input`, `tweaks`, `scripts`, `fonts`, `plugins`,
# `pc` and `x64`, all of which an author could reasonably use for a folder of
# their own.
#
# Nothing is known to break: redscript compiles a tree and takes module names
# from inside the files. It is still a change we have no right to make, and
# `cyberpunk_shapes.rs` pins it under
# `an_author_folder_sharing_a_name_with_a_game_directory_is_renamed` so it stays
# visible.
#
# The fix is anchoring an entry to a path prefix, so `mod` folds only under
# `archive/pc/`. That changes the profile schema, the order in which
# normalization applies rewrapping and casing, and both shipped games, so it is
# not done here.
canonical_case = [
  "archive",
  "pc",
  "mod",
  "mods",
  "r6",
  "scripts",
  "tweaks",
  "input",
  "config",
  "cache",
  "base",
  "cybercmd",
  "redsUserHints",
  "bin",
  "x64",
  "plugins",
  "cyber_engine_tweaks",
  "fonts",
  "tweakdb",
  "red4ext",
  "engine",
  "tools",
]

# Cyberpunk mods usually carry no installer metadata of their own: an archive is
# either loose payload roots or a loader release, and there is no Fluffy
# equivalent here.
#
# FOMOD is listed anyway. It began as a Bethesda format, but it is a generic
# XML installer and Cyberpunk authors do ship it — most often for a mod with
# body-type or texture-resolution variants, which is the same problem it was
# written to solve. Detection is by the presence of `fomod/ModuleConfig.xml`,
# not by game, so listing it here costs nothing when a mod does not have one and
# is the difference between a wizard and a wrong guess when it does.
#
# None of the five real archives this profile was checked against is a FOMOD, so
# this arm is not exercised by them. It is covered by the format's own tests.
formats = ["loose-roots", "loader", "fomod"]

[detection]
steam_app_id = 1091500
# Cyberpunk's binary sits at `bin/x64/Cyberpunk2077.exe`, not at the game root.
executable = "Cyberpunk2077.exe"

# Payload roots inside a normalized mod -> destination relative to the game dir.
# REDengine reads all of these in place, so source and target are the same.
[[deploy_targets]]
source = "archive"
target = "archive"

[[deploy_targets]]
source = "mods"
target = "mods"

[[deploy_targets]]
source = "r6"
target = "r6"

[[deploy_targets]]
source = "red4ext"
target = "red4ext"

[[deploy_targets]]
source = "bin"
target = "bin"

[[deploy_targets]]
source = "engine"
target = "engine"

# No patch chain: REDengine loads every `.archive` under `archive/pc/mod`
# directly, so a mod archive needs no renaming to be seen.

[loader]
name = "RED4ext"
kind = "dll-proxy"
# Unlike REFramework's root-level `dinput8.dll`, this proxy belongs beside the
# game binary. A copy at the game root is simply never loaded.
proxy_dll = "bin/x64/winmm.dll"
data_dirs = [
  "red4ext/plugins",
  "r6/scripts",
  "r6/tweaks",
  "bin/x64/plugins/cyber_engine_tweaks/mods",
]

[loader.proton]
# Two entries, because Cyberpunk's modding stack has two independent proxies in
# the same folder: RED4ext takes `winmm`, Cyber Engine Tweaks takes `version`.
# Registering only the first leaves half the stack silently dead.
wine_dll_overrides = "winmm=n,b;version=n,b"
steam_launch_options = 'WINEDLLOVERRIDES="winmm=n,b;version=n,b" %command%'
requires_prefix_write = true

# Archives packed from the inside out. A bare `scripts/` at the root really
# means `r6/scripts/`, and without these the mod imports as zero files.
[[rewrap]]
folder = "pc"
prefix = "archive"

[[rewrap]]
folder = "scripts"
prefix = "r6"

[[rewrap]]
folder = "tweaks"
prefix = "r6"

[[rewrap]]
folder = "input"
prefix = "r6"

[[rewrap]]
folder = "cache"
prefix = "r6"

# `plugins/` is ambiguous between `red4ext/plugins` and CET's
# `bin/x64/plugins`. RED4ext is the far more common bare shape, and a CET mod
# ships its full `bin/x64/...` path, so this resolves to RED4ext.
[[rewrap]]
folder = "plugins"
prefix = "red4ext"

[[rewrap]]
folder = "x64"
prefix = "bin"
