[package]
name = "apoc-apocrypha"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Client for the Apocrypha service: authorization-code sign-in, and the catalogue behind it."

[dependencies]
# The profile type and the port a published profile is served through. This
# crate implements that port; it does not define it, and the bundled profiles
# stay the fallback rather than moving here.
apoc-domain = { path = "../apoc-domain" }
apoc-gamedef = { path = "../apoc-gamedef" }
base64 = "0.22"
# The verifier and the state. The operating system's entropy source rather than
# a userspace generator, because both of these are credentials.
getrandom = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# rustls rather than native-tls so the build does not depend on system OpenSSL,
# matching apoc-nexus.
ureq = { version = "2", default-features = false, features = ["tls", "json", "gzip"] }

[features]
# Points the client at a local API instead of the real service. A compile-time
# feature rather than a setting, so a release build cannot be aimed at plain
# HTTP on localhost by a config file or a crafted link.
local-service = []
