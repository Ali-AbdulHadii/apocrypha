[workspace]
resolver = "2"
members = [
    "crates/apoc-domain",
    "crates/apoc-gamedef",
    "crates/apoc-modengine",
    "crates/apoc-steam",
    "crates/apoc-deploy",
    "crates/apoc-storage",
    "crates/apoc-nexus",
    "crates/apoc-apocrypha",
    "crates/apoc-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
authors = ["Apocrypha"]
repository = "https://github.com/apocrypha/apocrypha-desktop"
# The floor the dependency tree actually imposes, not an aspiration. It was
# "1.77" and had been untrue for some time: `sevenz-rust2` asks for 1.93 and
# quick-xml for 1.79, so a build on the declared version failed outright. CI
# runs `stable`, which is why nobody found out. The `msrv` job now builds on
# exactly this version, so the next dependency that raises the floor fails a
# pull request instead of making this line wrong again.
rust-version = "1.93"

# Shared dependency versions. Individual crates opt in via `dep.workspace = true`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
# Every compression method the format allows, not just the common one. A zip
# entry names its own codec, and `deflate` alone turned every other one into
# "Compression method not supported" — which is what a real Nexus mod (SkyHUD,
# packed with LZMA) did. Authors pick the codec from their packer's dropdown and
# the choice is invisible from the file name, so refusing one is refusing a mod
# for how it was zipped. `legacy-zip` and `ppmd` are here for the same reason at
# the other end of the age range: implode/shrink archives from the Oblivion era
# and WinZip's PPMd are both still on Nexus.
#
# 8 rather than 2 because 2's LZMA reader is wrong: it feeds the entry straight
# to `lzma-rs` including the four-byte ZIP-LZMA header, so it can only read the
# LZMA *it* wrote and fails on 7-Zip's with a bogus "LZ distance beyond output
# size". 8 parses that header and is pure Rust for lzma/xz/bzip2.
#
# `default-features` stays off to leave out `aes-crypto`: an encrypted mod needs
# a password nothing here can supply.
zip = { version = "8", default-features = false, features = [
    "deflate",
    "deflate64",
    "bzip2",
    "lzma",
    "xz",
    "zstd",
    "ppmd",
    "legacy-zip",
] }
sha2 = "0.10"
tracing = "0.1"
# A pull parser, not a deserializer. Real ModuleConfig.xml files put the same
# value in an attribute or a child element depending on which tool wrote them,
# vary their casing, and ignore the schema's element order, so a derive fails on
# files every other mod manager accepts. Pinned to the version Tauri already
# resolves, so this compiles nothing new. That pin is about what gets compiled;
# it says nothing about the MSRV, which `rust-version` above now states.
quick-xml = { version = "0.41", default-features = false }

# Faster, smaller release builds for a shipped desktop app.
[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
