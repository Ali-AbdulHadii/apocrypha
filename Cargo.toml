[workspace]
resolver = "2"
members = [
    "crates/apoc-domain",
    "crates/apoc-gamedef",
    "crates/apoc-modengine",
    "crates/apoc-steam",
    "crates/apoc-deploy",
    "crates/apoc-storage",
    "crates/apoc-nexus",
    "crates/apoc-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Apocrypha"]
repository = "https://github.com/apocrypha/apocrypha-desktop"
rust-version = "1.77"

# Shared dependency versions. Individual crates opt in via `dep.workspace = true`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
tracing = "0.1"

# Faster, smaller release builds for a shipped desktop app.
[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
