[package]
name = "apocrypha-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Apocrypha — Linux-first desktop mod manager."

[lib]
name = "apocrypha_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
apoc-domain = { path = "../../../crates/apoc-domain" }
apoc-gamedef = { path = "../../../crates/apoc-gamedef" }
apoc-modengine = { path = "../../../crates/apoc-modengine" }
apoc-steam = { path = "../../../crates/apoc-steam" }
apoc-deploy = { path = "../../../crates/apoc-deploy" }
apoc-storage = { path = "../../../crates/apoc-storage" }
apoc-nexus = { path = "../../../crates/apoc-nexus" }
apoc-apocrypha = { path = "../../../crates/apoc-apocrypha" }

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["tls", "json", "gzip"] }

[dev-dependencies]
tempfile = "3"
